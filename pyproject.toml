[project]
name = "mindpalace"
version = "0.1.0"
description = "A self-learning, always-on personal agent that runs on your Claude Max subscription. Ships generic, sharpens into your exact world over time."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aashutosh396" }]
keywords = ["agent", "claude", "assistant", "self-learning", "discord"]

# Core (terminal gateway) = the `claude` CLI + rich for the polished shell UI.
# The Discord gateway is optional — install with:  pip install "mindpalace[discord]"
dependencies = ["rich>=13", "prompt_toolkit>=3"]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
# v3 web GUI gateway:  pip install "mindpalace[web]"  ·  run with  mindpalace serve
web = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12"]

[project.scripts]
mindpalace = "mindpalace.cli:main"

[project.urls]
Homepage = "https://github.com/aashutosh396/mindpalace"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "mindpalace",
  "mindpalace.core",
  "mindpalace.agents",
  "mindpalace.gateways",
  "mindpalace.memory",
  "mindpalace.plugins",
  "mindpalace.plugins.contrib",
  "mindpalace.projects",
  "mindpalace.providers",
]

[tool.setuptools.package-data]
# ship the WHOLE reference-skill library: flat .md skills AND folder skills
# (SKILL.md + data/ + scripts/, e.g. ui-ux-pro-max's searchable design DB).
# setuptools globs don't recurse, so patterns are enumerated per depth (max 8).
mindpalace = [
  # v3 web GUI — the pre-built Nuxt bundle rides inside the package (users never run Node)
  "web_dist/*",
  "web_dist/*/*",
  "web_dist/*/*/*",
  "web_dist/*/*/*/*",
  "skills/global/*.md",
  "skills/global/*/*",
  "skills/global/*/*/*",
  "skills/global/*/*/*/*",
  "skills/global/*/*/*/*/*",
  "skills/global/*/*/*/*/*/*",
  "skills/global/*/*/*/*/*/*/*",
  "skills/global/*/*/*/*/*/*/*/*",
]
