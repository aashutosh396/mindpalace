# Build the mindpalace desktop app (Tauri shell + PyInstaller daemon sidecar)
# for every platform. Runs on version tags (v3*) and manually.
#
# The web UI is NOT built here — mindpalace/web_dist is committed (package
# data), so CI needs no Node build of the Nuxt app.
name: desktop

on:
  push:
    tags: ["v3*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # apple silicon
            triple: aarch64-apple-darwin
          - os: macos-13              # intel mac
            triple: x86_64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daemon sidecar
        shell: bash
        run: |
          python -m pip install ".[web]" pyinstaller
          cd desktop/sidecar
          bash build.sh python
          mkdir -p ../src-tauri/binaries
          cp dist/mindpalaced-* ../src-tauri/binaries/

      - name: Linux webview deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build desktop app
        run: |
          cd desktop
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: mindpalace-${{ matrix.triple }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
